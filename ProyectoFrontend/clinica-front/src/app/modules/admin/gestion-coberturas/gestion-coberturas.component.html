<div class="admin-container">
    <mat-card>
            <button mat-icon-button color="primary" (click)="goBack()" matTooltip="Volver al Panel de Administración">
                    <mat-icon>arrow_back</mat-icon>
            </button>
        <mat-card-header>
            <mat-card-title>Gestión de Coberturas Médicas</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            
            <div class="actions-header">
                <button mat-raised-button class="btnGest" (click)="agregarCobertura()">
                    <mat-icon>add</mat-icon> Nueva Cobertura
                </button>
            </div>

            <div *ngIf="cargando" class="loading-spinner">
                <mat-spinner diameter="40"></mat-spinner>
                <p>Cargando coberturas...</p>
            </div>
            
            <div *ngIf="!cargando && dataSource.data.length > 0" class="table-container">
                <table mat-table [dataSource]="dataSource" class="full-width-table">
                    
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef> Nombre de Cobertura </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
                    </ng-container>

                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button color="accent" matTooltip="Editar" (click)="editarCobertura(element)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminarCobertura(element.id, element.nombre)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <div *ngIf="!cargando && dataSource.data.length === 0" class="no-data">
                <p>No hay coberturas cargadas.</p>
            </div>

        </mat-card-content>
    </mat-card>
</div>

<div class="admin-container">
    
    <button mat-icon-button class="sidebar-toggle md:hidden" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
    </button>

    <aside class="admin-sidebar" [class.open]="sidebarAbierto">
        <h3 class="sidebar-title">Panel de Administración</h3>
        <nav>
            <ul class="admin-menu">
                <li>
                    <a routerLink="usuarios" routerLinkActive="active" (click)="closeSidebarOnMobile()">
                        <mat-icon class="menu-icon">people</mat-icon>
                        <span class="menu-text">Gestión de Usuarios</span>
                    </a>
                </li>
                <li>
                    <a routerLink="coberturas" routerLinkActive="active" (click)="closeSidebarOnMobile()">
                        <mat-icon class="menu-icon">local_hospital</mat-icon>
                        <span class="menu-text">Gestión de Coberturas</span>
                    </a>
                </li>
                
                <li>
                    <a routerLink="especialidades" routerLinkActive="active" (click)="closeSidebarOnMobile()">
                        <mat-icon class="menu-icon">science</mat-icon>
                        <span class="menu-text">Gestión de Especialidades</span>
                    </a>
                </li>
                
            </ul>
        </nav>
    </aside>

    <main class="admin-content">
        <app-admin-bienvenida *ngIf="showWelcomeModal"></app-admin-bienvenida>
        <router-outlet></router-outlet>
    </main>

</div>

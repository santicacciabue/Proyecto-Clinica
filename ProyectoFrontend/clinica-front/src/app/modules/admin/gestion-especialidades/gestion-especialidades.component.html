<div class="admin-container">
    <mat-card>
            <button mat-icon-button color="primary" (click)="goBack()" matTooltip="Volver al Panel de Administración">
                    <mat-icon>arrow_back</mat-icon>
            </button>
        <mat-card-header>
            <mat-card-title>Gestión de Especialidades Médicas</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            
            <div class="actions-header">
                <button mat-raised-button class="btnGest" (click)="agregarEspecialidad()">
                    <mat-icon>add</mat-icon> Nueva Especialidad
                </button>
            </div>

            <div *ngIf="!cargando && dataSource.data.length > 0" class="table-container">
                <table mat-table [dataSource]="dataSource" class="full-width-table">
                    
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef> Nombre de Especialidad </th>
                        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
                    </ng-container>

                    <ng-container matColumnDef="acciones" class="acciones">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let element" class="acciones-celdas">
                            <button mat-icon-button style="color: black;" matTooltip="Editar" (click)="editarEspecialidad(element)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button 
                                mat-raised-button 
                                matTooltip="Asociar nuevas Coberturas a la Especialidad" 
                                (click)="asociarCobertura(element)"
                                style="margin-right: 0px; background-color: #84abd1">
                                Asociar Cobertura
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminarEspecialidad(element)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <div *ngIf="!cargando && dataSource.data.length === 0" class="no-data">
                <p>No hay especialidades cargadas.</p>
            </div>

        </mat-card-content>
    </mat-card>
</div>

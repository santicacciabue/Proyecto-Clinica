<div class="gestion-container animate-slide-up">
    <mat-card class="premium-card">
        <div class="page-header">
            <button mat-icon-button color="primary" (click)="goBack()" matTooltip="Volver al Panel de Administración">
                <mat-icon>arrow_back</mat-icon>
            </button>
            <div>
                <h2>Gestión de Especialidades Médicas</h2>
            </div>
        </div>

        <mat-card-content>
            <div class="actions-bar">
                <button class="btn-premium btn-accent-premium" (click)="agregarEspecialidad()">
                    <mat-icon>add</mat-icon> Nueva Especialidad
                </button>
            </div>

            <div *ngIf="!cargando && dataSource.data.length > 0" class="premium-table-container">
                <div class="table-scroll-wrapper">
                    <table mat-table [dataSource]="dataSource">
                        
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef> ID </th>
                            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                        </ng-container>

                        <ng-container matColumnDef="nombre">
                            <th mat-header-cell *matHeaderCellDef> Nombre de Especialidad </th>
                            <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
                        </ng-container>

                        <ng-container matColumnDef="acciones">
                            <th mat-header-cell *matHeaderCellDef> Acciones </th>
                            <td mat-cell *matCellDef="let element" class="acciones-celdas">
                                <button class="action-icon-btn edit" matTooltip="Editar" (click)="editarEspecialidad(element)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button class="btn-premium btn-primary-premium btn-sm" 
                                    matTooltip="Asociar nuevas Coberturas a la Especialidad" 
                                    (click)="asociarCobertura(element)">
                                    Asociar Cobertura
                                </button>
                                <button class="action-icon-btn delete" matTooltip="Eliminar" (click)="eliminarEspecialidad(element)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
            </div>

            <div *ngIf="!cargando && dataSource.data.length === 0" class="empty-state">
                <mat-icon>science</mat-icon>
                <p>No hay especialidades cargadas.</p>
            </div>
        </mat-card-content>
    </mat-card>
</div>

<mat-sidenav-container class="min-h-screen w-full bg-transparent">

  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="sidenav-panel">
    <h2 class="sidebar-title">Panel Médico</h2>
    <ul class="sidebar-menu">
      <li>
        <a routerLink="./turnos" routerLinkActive="active" (click)="isMobile ? sidenav.close() : null">
          <mat-icon>event_note</mat-icon>
          <span class="menu-text">Mis Turnos</span>
        </a>
      </li>
      <li>
        <a routerLink="./agenda" routerLinkActive="active" (click)="isMobile ? sidenav.close() : null">
          <mat-icon>schedule</mat-icon>
          <span class="menu-text">Gestionar Agenda</span>
        </a>
      </li>

    </ul>
  </mat-sidenav>

  <mat-sidenav-content class="p-6">
    <!-- Hamburger button visible ONLY on mobile -->
    <div class="block md:hidden mb-6">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle sidebar"
        class="bg-[var(--primary)] text-white shadow-md" style="background-color: var(--primary);">
        <mat-icon>menu</mat-icon>
      </button>
    </div>

    <!-- Main Content -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

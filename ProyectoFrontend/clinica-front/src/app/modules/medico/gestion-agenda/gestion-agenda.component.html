<div class="agenda-container animate-slide-up">
    <div class="page-header">
        <mat-icon>calendar_today</mat-icon>
        <div>
            <h2>Gestión de Agenda</h2>
        </div>
    </div>

    <div class="premium-card fecha-card">
        <div class="fecha-row">
            <div class="fecha-field">
                <label class="fecha-label">Seleccionar día</label>
                <input
                    type="date"
                    class="fecha-input"
                    [value]="fechaSeleccionada"
                    (change)="onFechaChange($event)"
                />
            </div>

            <div class="fecha-action">
                <button class="btn-premium btn-accent-premium" (click)="mostrarCamposHorario()">
                    <mat-icon>add</mat-icon> Agregar nuevo horario
                </button>
            </div>
        </div>
    </div>

    <div *ngIf="mostrarCampos" class="premium-card nuevo-horario-card">
        <h4 class="section-title">Nuevo rango horario</h4>
        <div class="horario-fields">
            <div class="horario-field">
                <label class="fecha-label">Hora desde</label>
                <input
                    type="time"
                    class="fecha-input"
                    [(ngModel)]="nuevoRango.hora_entrada"
                />
            </div>
            <div class="horario-field">
                <label class="fecha-label">Hora hasta</label>
                <input
                    type="time"
                    class="fecha-input"
                    [(ngModel)]="nuevoRango.hora_salida"
                />
            </div>
            <div class="horario-action">
                <button
                    class="btn-premium btn-primary-premium"
                    (click)="agregarHorario()"
                    [disabled]="!nuevoRango.hora_entrada || !nuevoRango.hora_salida">
                    <mat-icon>save</mat-icon> Guardar
                </button>
            </div>
        </div>
    </div>

    <div class="premium-table-container">
        <div *ngIf="horariosCargados.length > 0; else sinHorarios" class="table-scroll-wrapper">
            <table class="agenda-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hora Entrada</th>
                        <th>Hora Salida</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let h of horariosCargados">
                        <td>{{ h.id }}</td>
                        <td>{{ h.hora_entrada | slice: 0:5 }}</td>
                        <td>{{ h.hora_salida | slice: 0:5 }}</td>
                        <td>
                            <button class="action-icon-btn delete" (click)="eliminarHorario(h.id)" matTooltip="Eliminar">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <ng-template #sinHorarios>
            <div class="empty-state">
                <mat-icon>event_busy</mat-icon>
                <p>No hay horarios cargados para este día.</p>
            </div>
        </ng-template>
    </div>
</div>
